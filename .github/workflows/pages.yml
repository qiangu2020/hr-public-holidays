name: Official holiday calendar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: holiday-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install official PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Refresh official data
        run: python refresh.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build HeroUI calendar
        run: npm ci && npm run build
      - name: Preserve verified public dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static/data/holidays.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official holiday data"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy calendar
        id: deployment
        uses: actions/deploy-pages@v4
